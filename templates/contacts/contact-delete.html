{% extends 'base.html' %}
{% block title %}Delete Contact{% endblock %}

{% block content %}
<h1>Delete Contact</h1>

<p>Are you sure you want to delete {{ object.name }}?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Confirm Delete</button>
</form>

<a href="{% url 'contact-detail' object.pk %}">Cancel</a>
{% endblock %}

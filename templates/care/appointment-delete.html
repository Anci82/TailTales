{% extends 'base.html' %}
{% block title %}Delete Appointment{% endblock %}
{% block content %}
<h1>Delete Appointment</h1>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Confirm</button>
</form>
<a href="{% url 'appointment-detail' object.pk %}">Cancel</a>
{% endblock %}

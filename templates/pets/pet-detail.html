{% extends 'base.html' %}

{% block title %}{{ pet.name }}{% endblock %}

{% block content %}
<h1>{{ pet.name }}</h1>

<p>Species: {{ pet.species }}</p>
<p>Breed: {{ pet.breed }}</p>
<p>Age: {{ pet.age }}</p>
<p>Weight: {{ pet.weight }}</p>
<p>Photo URL: {{ pet.photo_url }}</p>

<a href="{% url 'pet-edit' pet.pk %}">Edit</a>
<a href="{% url 'pet-delete' pet.pk %}">Delete</a>
<a href="{% url 'pet-list' %}">Back to list</a>
{% endblock %}

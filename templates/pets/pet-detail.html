{% extends 'base.html' %}

{% block title %}{{ pet.name }}{% endblock %}

{% block content %}
    <section class="form-section">
        <div class="form-card">
            <h1>{{ pet.name }}</h1>

            {% if pet.photo %}
                <div class="pet-image-wrapper">
                    <a href="{{ pet.photo.url }}" target="_blank" rel="noopener noreferrer">
                        <img src="{{ pet.photo.url }}" alt="{{ pet.name }}" class="pet-image">
                    </a>
                </div>
            {% endif %}

            <p><strong>Species:</strong> {{ pet.species }}</p>
            <p><strong>Breed:</strong> {{ pet.breed }}</p>
            <p><strong>Age:</strong> {{ pet.age }}</p>
            <p><strong>Weight:</strong> {{ pet.weight }}</p>

            <div class="form-actions">
                <a class="primary-btn" href="{% url 'pet-edit' pet.pk %}">Edit</a>
                <a class="primary-btn" href="{% url 'pet-delete' pet.pk %}">Delete</a>
                <a class="primary-btn" href="{% url 'pet-list' %}">Back to list</a>
            </div>
        </div>
    </section>
{% endblock %}

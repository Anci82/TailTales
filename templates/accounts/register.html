{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
    <section class="form-page">
        <div class="form-card">
            <h1>Create Account</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="primary-btn">Create Account</button>
                    <a class="secondary-btn" href="{% url 'home' %}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}

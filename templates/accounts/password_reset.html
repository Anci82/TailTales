{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="form-page login-page">
    <div class="login-card-wrap">
        <div class="login-badge">
            <img src="{% static 'images/login-badge.png' %}" alt="Cute dog and cat" class="login-badge-image">
        </div>

        <div class="form-card login-card">
            <h1>Reset password</h1>
            <p class="login-subtitle">
                Enter the email linked to your account and we’ll send you a reset link.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="primary-btn">Send reset link</button>
                    <a href="{% url 'login' %}" class="secondary-btn">Back to login</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

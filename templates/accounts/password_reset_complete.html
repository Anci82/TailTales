{% extends 'base.html' %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<section class="form-page login-page">
    <div class="form-card login-card">
        <h1>Password updated</h1>
        <p class="login-subtitle">
            Your password has been changed successfully. You can log in now.
        </p>
        <div class="form-actions">
            <a href="{% url 'login' %}" class="primary-btn">Go to login</a>
        </div>
    </div>
</section>
{% endblock %}
